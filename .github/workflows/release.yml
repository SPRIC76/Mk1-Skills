# Publishes a release when VERSION changes on main (its tag is v<VERSION>): each skill as <name>.skill, and The Triad and The Proof Pack as the-triad.zip and the-proof-pack.zip,
# so the downloads can be counted.
name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir -p dist
          cd skills
          for s in *; do zip -qrX "../dist/$s.skill" "$s"; done
          mkdir -p ../stage/the-triad
          cp -r devcom5 synk182 solid8 ../stage/the-triad/
          cp ../bundles/the-triad/README.md ../stage/the-triad/
          mkdir -p ../stage/the-proof-pack
          cp -r verifox testcatch browsetest ../stage/the-proof-pack/
          cp ../bundles/the-proof-pack/README.md ../stage/the-proof-pack/
          cd ../stage && zip -qrX ../dist/the-triad.zip the-triad && zip -qrX ../dist/the-proof-pack.zip the-proof-pack
          ls -l ../dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          gh release view "$v" >/dev/null 2>&1 && { echo "$v already released"; exit 0; }
          gh release create "$v" dist/* --target "$GITHUB_SHA" --title "MK1 skills $v" --notes "Released copies. Get them at https://mk1made.us"
